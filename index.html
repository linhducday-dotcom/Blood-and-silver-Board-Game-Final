            ${cardId === 'wizard' ? `
              <div class="font-heading text-xs font-bold text-[#16423c] mb-2">CHOOSE A PREVIOUSLY PLAYED CARD TO COPY (-1 GOLD COST):</div>
              <div class="space-y-2 max-h-60 overflow-y-auto mb-3">
                ${[...new Set(state.room.playedCardsHistory)].map(cId => {
                  const def = CARD_LIBRARY.find(c => c.id === cId);
                  if (!def) return '';
                  const discCost = Math.max(0, def.cost - 1);
                  return `
                    <button data-action="confirm-card-target" data-target="${def.id}"
                            class="sketch-btn btn-cream w-full py-2.5 px-3 text-xs flex items-center justify-between">
                      <span>${def.name}</span>
                      <span class="text-[#c78d20]">${discCost} GOLD</span>
                    </button>
                  `;
                }).join('') || `<div class="text-center font-heading text-xs text-[#534b3b] py-4">NO OTHER CARDS PLAYED THIS GAME YET!</div>`}
              </div>
            ` : `
              <div class="space-y-2 max-h-64 overflow-y-auto mb-3">
                ${cardId === 'accuse' && state.room.dragon ? `
                  <button data-action="confirm-card-target" data-target="DRAGON"
                          class="sketch-btn btn-gold w-full py-2.5 px-3 text-xs flex items-center justify-between">
                    <span>🐉 ACCUSE THE DRAGON (${state.room.dragon.accusations}/3)</span>
                    <span>FREE</span>
                  </button>
                ` : ''}

                ${livingPlayers.map(p => {
                  const priorAcc = p.accusedThisTurnByActive || 0;
                  const accCostLabel = priorAcc === 0 ? 'FREE' : (priorAcc === 1 ? '3 GOLD' : '5 GOLD');
                  return `
                    <button data-action="confirm-card-target" data-target="${p.id}"
                            class="sketch-btn btn-cream w-full py-2 px-3 text-xs flex items-center justify-between">
                      <span class="flex items-center gap-2">
                        ${renderAvatarSVG(p.avatarId, 26)}
                        <span>${p.name} ${p.id === myClientId ? '(YOU)' : ''}</span>
                      </span>
                      <span class="text-[10px] text-[#534b3b]">
                        ${cardId === 'accuse' ? accCostLabel : `${p.gold}G · ${p.accusations}🎃`}
                      </span>
                    </button>
                  `;
                }).join('')}
              </div>
            `}

            <button data-action="close-modal" class="sketch-btn btn-cream w-full py-2 text-xs">CANCEL</button>
          </div>
        `;
        return;
      }

      // 9. COUNCIL DISCUSSION & SILENT CLOCKWISE VOTE MODAL
      if (state.activeModal === 'council_vote') {
        const livingPlayers = state.room.players.filter(p => p.alive);
        layer.innerHTML = `
          <div class="sketch-box w-full max-w-[400px] p-5 text-center">
            <h3 class="font-heading text-lg font-bold text-[#16423c] mb-1">COUNCIL VOTE</h3>
            <p class="font-heading text-[10px] text-[#534b3b] mb-4">
              DISCUSS OPENLY, THEN CAST YOUR VOTE IN SILENCE. MOST VOTES GAINS 2 PUMPKIN ACCUSATIONS; TIES GAIN 1 ACCUSATION EACH!
            </p>
            <div class="space-y-2 mb-4">
              ${livingPlayers.map(p => `
                <button data-action="cast-council-vote" data-target="${p.id}"
                        class="sketch-btn btn-cream w-full py-2.5 px-3 text-xs flex items-center justify-between">
                  <span class="flex items-center gap-2">
                    ${renderAvatarSVG(p.avatarId, 28)}
                    <span>VOTE FOR ${p.name}</span>
                  </span>
                  <span>👉</span>
                </button>
              `).join('')}
            </div>
          </div>
        `;
        return;
      }

      // 10. REACTIVE EXTRA LIFE / KING PROMPT MODAL
      if (state.activeModal === 'reaction_prompt') {
        const me = getMyPlayer();
        const target = state.room.players.find(p => p.id === state.pendingReactionTargetId);
        const canExtra = me && me.hand.includes('extralife') && me.gold >= 5;
        const canKing = me && me.hand.includes('king') && me.gold >= 7;

        layer.innerHTML = `
          <div class="sketch-box w-full max-w-[380px] p-5 text-center">
            <h3 class="font-heading text-base font-bold text-red-800 mb-2">⚠️ ${target?.name || 'PLAYER'} REACHED 3 ACCUSATIONS!</h3>
            <p class="font-heading text-xs text-[#1b312e] mb-4">
              YOU HOLD A HIDDEN SAVE CARD! WOULD YOU LIKE TO REVEAL IT NOW TO SAVE ${target?.name}?
            </p>
            <div class="space-y-2">
              ${canExtra ? `
                <button data-action="use-reactive-save" data-card="extralife" class="sketch-btn btn-gold w-full py-2.5 text-xs">
                  REVEAL EXTRA LIFE (5 GOLD) — RAISE THRESHOLD TO 4
                </button>
              ` : ''}
              ${canKing ? `
                <button data-action="use-reactive-save" data-card="king" class="sketch-btn btn-gold w-full py-2.5 text-xs">
                  REVEAL KING (7 GOLD) — RAISE THRESHOLD TO 4 & CLEAR ACCUSATIONS
                </button>
              ` : ''}
              <button data-action="decline-reactive-save" class="sketch-btn btn-cream w-full py-2.5 text-xs">
                DO NOT SAVE (LET ELIMINATION RESOLVE)
              </button>
            </div>
          </div>
        `;
      }
    }

    // ============================================================================
    // 9. MASTER RENDER & EVENT DELEGATION
    // ============================================================================
    function renderApp() {
      const root = document.getElementById('appRoot');
      if (!root) return;

      const decor = document.getElementById('halloweenDecor');
      if (decor) {
        decor.style.display = state.settings.halloweenTheme ? 'block' : 'none';
      }

      if (state.screen === 'landing') root.innerHTML = renderLandingScreen();
      else if (state.screen === 'find_game') root.innerHTML = renderFindGameScreen();
      else if (state.screen === 'lobby') root.innerHTML = renderLobbyScreen();
      else if (state.screen === 'countdown') root.innerHTML = renderCountdownScreen();
      else if (state.screen === 'how_to_play') root.innerHTML = renderHowToPlayScreen();
      else if (state.screen === 'role_reveal') root.innerHTML = renderRoleRevealScreen();
      else if (state.screen === 'game') root.innerHTML = renderGameScreen();

      renderFloatingControls();
      renderActiveModal();
      bindDynamicInputs();
    }

    function bindDynamicInputs() {
      const uInput = document.getElementById('usernameInput') || document.getElementById('usernameInputFind');
      if (uInput) {
        uInput.oninput = (e) => {
          state.username = e.target.value.toUpperCase();
        };
      }

      const slider = document.getElementById('commonwealthSlider');
      if (slider) {
        slider.oninput = (e) => {
          state.step1Amount = parseInt(e.target.value, 10);
          renderApp();
        };
      }

      const dmSelect = document.getElementById('dmRecipientSelect');
      if (dmSelect) {
        dmSelect.onchange = (e) => {
          state.directRecipientId = e.target.value;
          renderActiveModal();
        };
      }

      const chatInput = document.getElementById('chatMessageInput');
      if (chatInput) {
        chatInput.onkeydown = (e) => {
          if (e.key === 'Enter') {
            sendChatMessage();
          }
        };
      }
    }

    function sendChatMessage() {
      const chatInput = document.getElementById('chatMessageInput');
      if (!chatInput || !chatInput.value.trim()) return;

      const me = getMyPlayer();
      const text = chatInput.value.trim();
      const otherPlayers = state.room.players.filter(p => p.id !== myClientId);
      if (!state.directRecipientId && otherPlayers.length > 0) {
        state.directRecipientId = otherPlayers[0].id;
      }

      state.room.messages.push({
        id: 'msg_' + Date.now(),
        channel: state.chatTab,
        senderId: myClientId,
        senderName: me?.name || state.username,
        recipientId: state.chatTab === 'direct' ? state.directRecipientId : null,
        text
      });

      chatInput.value = '';
      playSoundEffect('click');
      broadcastRoomState();
      renderActiveModal();
    }

    // Global Click Delegation
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;

      const action = btn.getAttribute('data-action');
      playSoundEffect('click');

      switch (action) {
        case 'new-game':
          initLobby(generateRoomCode(), false, true);
          break;
        case 'find-game':
          state.screen = 'find_game';
          renderApp();
          break;
        case 'create-public-lobby':
          initLobby('TURF-FACT', true, false);
          break;
        case 'join-sample-lobby':
          initLobby(btn.getAttribute('data-code') || 'HAZE-FONT', true, true);
          break;
        case 'watch-sample-game':
        case 'watch-tv':
          state.isSpectator = true;
          initLobby('HOOK-MIST', true, true);
          setupNewMatch();
          state.room.phase = 'day';
          state.screen = 'game';
          renderApp();
          break;
        case 'open-join-modal':
          state.activeModal = 'join_code';
          renderActiveModal();
          break;
        case 'confirm-join-code': {
          const inp = document.getElementById('joinRoomCodeInput');
          const code = (inp?.value || 'CROW-CARE').toUpperCase().trim();
          state.activeModal = null;
          initLobby(code, false, true);
          break;
        }
        case 'back-landing':
        case 'exit-to-landing':
          state.activeModal = null;
          document.body.classList.remove('night-mode');
          state.screen = 'landing';
          renderApp();
          break;
        case 'open-avatar-modal':
          state.activeModal = 'avatar';
          renderActiveModal();
          break;
        case 'select-avatar': {
          const id = parseInt(btn.getAttribute('data-id'), 10);
          state.avatarId = id;
          const me = getMyPlayer();
          if (me) me.avatarId = id;
          broadcastRoomState();
          renderApp();
          break;
        }
        case 'close-modal':
          state.activeModal = null;
          state.pendingCardPlay = null;
          renderActiveModal();
          break;
        case 'add-bot':
          addBotToLobby();
          break;
        case 'remove-player': {
          const pid = btn.getAttribute('data-id');
          state.room.players = state.room.players.filter(p => p.id !== pid);
          broadcastRoomState();
          renderApp();
          break;
        }
        case 'copy-invite': {
          const temp = document.createElement('textarea');
          temp.value = `${window.location.href} (Room Code: ${state.room.code})`;
          document.body.appendChild(temp);
          temp.select();
          document.execCommand('copy');
          temp.remove();
          showToast(`COPIED ROOM INVITE (${state.room.code}) TO CLIPBOARD!`);
          break;
        }
        case 'set-timer':
          state.room.turnTimerSetting = btn.getAttribute('data-val');
          broadcastRoomState();
          renderApp();
          break;
        case 'set-gold-goal':
          state.room.goblinGoldGoal = parseInt(btn.getAttribute('data-val'), 10);
          broadcastRoomState();
          renderApp();
          break;
        case 'prev-slide':
          state.howToPlaySlideIdx = (state.howToPlaySlideIdx - 1 + HOW_TO_PLAY_SLIDES.length) % HOW_TO_PLAY_SLIDES.length;
          renderApp();
          break;
        case 'next-slide':
          state.howToPlaySlideIdx = (state.howToPlaySlideIdx + 1) % HOW_TO_PLAY_SLIDES.length;
          renderApp();
          break;
        case 'prev-lobby-card':
          state.lobbyCarouselIdx = (state.lobbyCarouselIdx - 1 + CARD_LIBRARY.length) % CARD_LIBRARY.length;
          renderApp();
          break;
        case 'next-lobby-card':
          state.lobbyCarouselIdx = (state.lobbyCarouselIdx + 1) % CARD_LIBRARY.length;
          renderApp();
          break;
        case 'start-game':
          if (state.room.players.length < 5) {
            addBotToLobby();
          } else {
            startPreGameCountdown();
          }
          break;
        case 'cancel-countdown':
          cancelPreGameCountdown();
          break;
        case 'skip-how-to-play':
          state.room.phase = 'role_reveal';
          state.screen = 'role_reveal';
          broadcastRoomState();
          renderApp();
          break;
        case 'toggle-role-card':
          state.roleRevealed = !state.roleRevealed;
          renderApp();
          break;
        case 'enter-day-1':
          state.room.phase = 'day';
          state.screen = 'game';
          broadcastRoomState();
          renderApp();
          maybeRunBotTurn();
          break;
        case 'confirm-step1':
          confirmStep1Commonwealth();
          break;
        case 'end-turn':
          endCurrentPlayerTurn();
          break;
        case 'toggle-cycle-mode':
          state.cycleMode = !state.cycleMode;
          renderApp();
          break;
        case 'play-hand-card': {
          const idx = parseInt(btn.getAttribute('data-idx'), 10);
          handleCardClickInHand(idx);
          break;
        }
        case 'select-draw-keep': {
          if (state.pendingCardPlay) {
            state.pendingCardPlay.keepCardIdx = parseInt(btn.getAttribute('data-idx'), 10);
            renderActiveModal();
          }
          break;
        }
        case 'confirm-card-target': {
          const targetId = btn.getAttribute('data-target');
          if (!state.pendingCardPlay) break;
          const { cardId, selectedTargets } = state.pendingCardPlay;

          // Linked & Robin Hood allow picking 2 targets
          if ((cardId === 'linked' || cardId === 'robinhood') && selectedTargets.length === 0) {
            selectedTargets.push(targetId);
            showToast('NOW SELECT THE 2ND PLAYER');
            return;
          }
          if (selectedTargets.length === 1) {
            executeTargetedCardPlay(selectedTargets[0], targetId);
          } else {
            executeTargetedCardPlay(targetId);
          }
          break;
        }
        case 'cast-council-vote': {
          const votedId = btn.getAttribute('data-target');
          const votedPlayer = state.room.players.find(p => p.id === votedId);
          state.activeModal = null;
          if (votedPlayer) {
            addLogEntry(`COUNCIL VOTE COMPLETE! ${votedPlayer.name} RECEIVED THE MOST VOTES (+2 ACCUSATIONS).`);
            applyAccusationToPlayer(votedPlayer, 2, 'COUNCIL');
          }
          broadcastRoomState();
          renderApp();
          break;
        }
        case 'use-reactive-save': {
          const saveCardId = btn.getAttribute('data-card');
          const me = getMyPlayer();
          const target = state.room.players.find(p => p.id === state.pendingReactionTargetId);
          if (me && target) {
            const hIdx = me.hand.indexOf(saveCardId);
            if (hIdx !== -1) {
              if (saveCardId === 'extralife') {
                consumeCardFromHand(me, hIdx, 'extralife', 5);
                target.threshold = 4;
                addLogEntry(`${me.name} REVEALS EXTRA LIFE TO SAVE ${target.name}! THRESHOLD RAISED TO 4.`);
              } else if (saveCardId === 'king') {
                consumeCardFromHand(me, hIdx, 'king', 7);
                target.threshold = 4;
                target.accusations = 0;
                addLogEntry(`${me.name} REVEALS KING TO SAVE ${target.name}! THRESHOLD RAISED TO 4 & ACCUSATIONS CLEARED.`);
              }
            }
          }
          state.activeModal = null;
          broadcastRoomState();
          renderApp();
          break;
        }
        case 'decline-reactive-save': {
          const target = state.room.players.find(p => p.id === state.pendingReactionTargetId);
          state.activeModal = null;
          if (target) eliminatePlayer(target, false);
          checkWinConditions();
          broadcastRoomState();
          renderApp();
          break;
        }
        case 'night-acc-plus': {
          const pid = btn.getAttribute('data-id');
          const me = getMyPlayer();
          if (!me) break;
          const quota = getNightAccusationQuota();
          if (!state.room.nightVotes[me.id]) {
            state.room.nightVotes[me.id] = { allocations: {}, confirmed: false };
          }
          const alloc = state.room.nightVotes[me.id].allocations;
          const used = Object.values(alloc).reduce((a, b) => a + b, 0);
          if (used < quota) {
            alloc[pid] = (alloc[pid] || 0) + 1;
            renderApp();
          } else {
            showToast(`MAXIMUM ${quota} ACCUSATION(S) TONIGHT`);
          }
          break;
        }
        case 'night-acc-minus': {
          const pid = btn.getAttribute('data-id');
          const me = getMyPlayer();
          if (!me || !state.room.nightVotes[me.id]) break;
          const alloc = state.room.nightVotes[me.id].allocations;
          if ((alloc[pid] || 0) > 0) {
            alloc[pid] -= 1;
            renderApp();
          }
          break;
        }
        case 'confirm-night-accusations':
          resolveNightPhaseAccusations();
          break;
        case 'skip-card-cutscene':
          skipCardCutscene();
          break;
        case 'skip-night-raid':
          finishNightRaidCutscene();
          break;
        case 'open-menu-modal':
          state.activeModal = 'menu';
          renderActiveModal();
          break;
        case 'open-history-modal':
          state.activeModal = 'history';
          renderActiveModal();
          break;
        case 'open-library-modal':
          state.activeModal = 'library';
          renderActiveModal();
          break;
        case 'open-rules-modal':
          state.activeModal = 'rules';
          renderActiveModal();
          break;
        case 'open-chat-modal': {
          const other = state.room.players.find(p => p.id !== myClientId);
          if (!state.directRecipientId && other) state.directRecipientId = other.id;
          state.activeModal = 'chat';
          renderActiveModal();
          break;
        }
        case 'set-chat-tab':
          state.chatTab = btn.getAttribute('data-tab');
          renderActiveModal();
          break;
        case 'send-chat':
          sendChatMessage();
          break;
        case 'toggle-tips':
          state.settings.tips = !state.settings.tips;
          renderActiveModal();
          renderApp();
          break;
        case 'toggle-sound':
          state.settings.sound = !state.settings.sound;
          renderActiveModal();
          break;
        case 'toggle-halloween':
          state.settings.halloweenTheme = !state.settings.halloweenTheme;
          renderApp();
          break;
        case 'play-again':
          setupNewMatch();
          break;
        case 'return-lobby':
          state.room.phase = 'lobby';
          state.screen = 'lobby';
          broadcastRoomState();
          renderApp();
          break;
      }
    });

    // Initialize Application on Load
    window.onload = () => {
      renderApp();
    };
  </script>
</body>
</html>
