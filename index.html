<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goblins Gambit — Halloween Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --parchment: #f3eee1;
      --parchment-dark: #e2d8be;
      --parchment-card: #ebe3ce;
      --ink: #1a2e2b;
      --ink-muted: #534b3b;
      --gold-btn: #cfa446;
      --gold-btn-hover: #be9234;
      --green-step: #1f7a1f;
      --night-bg: #0b1929;
      --halloween-orange: #ff7518;
      --halloween-purple: #8b3dff;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'EB Garamond', Georgia, serif;
      background-color: var(--parchment);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
      background-image: 
        radial-gradient(rgba(139, 119, 85, 0.08) 1px, transparent 0),
        radial-gradient(rgba(139, 119, 85, 0.06) 1px, transparent 0),
        linear-gradient(180deg, rgba(255, 117, 24, 0.04) 0%, rgba(243, 238, 225, 0.95) 25%, rgba(243, 238, 225, 1) 100%);
      background-size: 32px 32px, 16px 16px, 100% 100%;
      background-position: 0 0, 8px 8px, 0 0;
    }

    body.night-mode {
      background-color: var(--night-bg);
      background-image: 
        radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 0),
        linear-gradient(180deg, #07111d 0%, #0f2238 100%);
      background-size: 40px 40px, 100% 100%;
    }

    .font-title {
      font-family: 'Playfair Display', Georgia, serif;
    }

    .font-heading {
      font-family: 'Cinzel', Georgia, serif;
      letter-spacing: 0.04em;
    }

    /* Hand-drawn / Sketchy Vintage Border Effect */
    .sketch-box {
      border: 2.5px solid #1b312e;
      border-radius: 6px;
      background-color: var(--parchment);
      box-shadow: 0 2px 6px rgba(26, 46, 43, 0.08);
    }

    .sketch-box-tan {
      border: 2px solid #1b312e;
      border-radius: 5px;
      background-color: var(--parchment-dark);
    }

    .sketch-btn {
      border: 2.2px solid #1b312e;
      border-radius: 5px;
      font-family: 'Cinzel', Georgia, serif;
      font-weight: 700;
      letter-spacing: 0.04em;
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .sketch-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.14);
    }

    .sketch-btn:active:not(:disabled) {
      transform: translateY(0px);
    }

    .sketch-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-gold {
      background-color: var(--gold-btn);
      color: #111f1d;
    }
    .btn-gold:hover:not(:disabled) {
      background-color: var(--gold-btn-hover);
    }

    .btn-cream {
      background-color: #f3eee1;
      color: #1b312e;
    }
    .btn-cream:hover:not(:disabled) {
      background-color: #e7dec8;
    }

    .btn-dark-teal {
      background-color: #16423c;
      color: #f3eee1;
    }
    .btn-dark-teal:hover:not(:disabled) {
      background-color: #0f312c;
    }

    /* Custom Range Slider for Step 1 Commonwealth */
    input[type="range"].commonwealth-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: linear-gradient(90deg, #b59c6b 0%, #cfa446 100%);
      border-radius: 4px;
      outline: none;
    }

    input[type="range"].commonwealth-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #ff7518;
      border: 2.5px solid #1b312e;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.25);
    }

    /* Floating Halloween Bats Animation */
    @keyframes floatBat {
      0%, 100% { transform: translateY(0px) rotate(-3deg); }
      50% { transform: translateY(-7px) rotate(4deg); }
    }
    .bat-float {
      animation: floatBat 4s ease-in-out infinite;
    }
    .bat-float-delayed {
      animation: floatBat 5.2s ease-in-out 1.5s infinite;
    }

    /* Card hover lift in hand */
    .hand-card {
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s ease;
    }
    .hand-card:hover {
      transform: translateY(-16px) scale(1.04) !important;
      z-index: 30 !important;
      box-shadow: 0 12px 24px rgba(0,0,0,0.22);
    }

    /* Cutscene & Tabletop Animations */
    @keyframes pulseGlowRing {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 117, 24, 0.7), 0 0 15px rgba(255, 117, 24, 0.5); }
      50% { box-shadow: 0 0 0 8px rgba(255, 117, 24, 0), 0 0 25px rgba(255, 117, 24, 0.85); }
    }
    .active-seat-glow {
      animation: pulseGlowRing 2s infinite;
    }

    @keyframes daggerSlashAnim {
      0% { transform: translate(-180px, -160px) rotate(-45deg) scale(0.5); opacity: 0; }
      35% { transform: translate(0px, 0px) rotate(15deg) scale(1.35); opacity: 1; }
      55% { transform: translate(12px, 12px) rotate(25deg) scale(1.15); }
      100% { transform: translate(0px, 0px) rotate(20deg) scale(1.2); opacity: 1; }
    }
    .anim-dagger-strike {
      animation: daggerSlashAnim 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes slashWave {
      0% { transform: scale(0.2) rotate(-30deg); opacity: 1; }
      100% { transform: scale(2.2) rotate(-30deg); opacity: 0; }
    }
    .anim-slash-wave {
      animation: slashWave 0.7s ease-out 0.3s forwards;
    }

    @keyframes candyShowerDrop {
      0% { transform: translateY(-120px) rotate(0deg) scale(0.6); opacity: 0; }
      25% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateY(110px) rotate(320deg) scale(1.1); opacity: 0; }
    }
    .anim-candy-drop {
      animation: candyShowerDrop 1.6s ease-in infinite;
    }

    @keyframes dragonSwoop {
      0% { transform: translateY(-140px) scale(0.4); opacity: 0; }
      40% { transform: translateY(0px) scale(1.25); opacity: 1; }
      70% { transform: translateY(-8px) scale(1.15); }
      100% { transform: translateY(0px) scale(1.18); opacity: 1; }
    }
    .anim-dragon-swoop {
      animation: dragonSwoop 0.9s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    }

    @keyframes pumpkinSlam {
      0% { transform: scale(2.8) translateY(-60px); opacity: 0; }
      50% { transform: scale(0.9) translateY(5px); opacity: 1; }
      75% { transform: scale(1.15) translateY(-4px); }
      100% { transform: scale(1) translateY(0px); opacity: 1; }
    }
    .anim-pumpkin-slam {
      animation: pumpkinSlam 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes goblinSneakHop {
      0%, 100% { transform: translateY(0px) rotate(-6deg); }
      50% { transform: translateY(-14px) rotate(8deg); }
    }
    .goblin-raider-hop {
      animation: goblinSneakHop 0.42s ease-in-out infinite;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(210, 198, 170, 0.3);
    }
    ::-webkit-scrollbar-thumb {
      background: #8c7b5c;
      border-radius: 3px;
    }
  </style>
</head>
<body class="relative min-h-screen flex flex-col justify-between">

  <!-- HALLOWEEN CORNER DECORATIONS (COBWEBS, BATS & PUMPKIN GARLAND) -->
  <div id="halloweenDecor" class="pointer-events-none fixed inset-0 z-40 overflow-hidden">
    <!-- Top Left Cobweb -->
    <svg class="absolute top-0 left-0 w-28 h-28 md:w-36 md:h-36 opacity-25 text-stone-900" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.4">
      <path d="M0 0 L100 0 M0 0 L0 100 M0 0 L95 35 M0 0 L75 75 M0 0 L35 95"/>
      <path d="M22 0 Q20 20 0 22 M44 0 Q38 38 0 44 M68 0 Q56 56 0 68 M90 0 Q74 74 0 90"/>
      <!-- Hanging little spider -->
      <line x1="35" y1="45" x2="35" y2="72" stroke-width="1"/>
      <circle cx="35" cy="75" r="3.5" fill="currentColor"/>
      <path d="M31 73 L28 71 M31 75 L27 75 M31 77 L28 79 M39 73 L42 71 M39 75 L43 75 M39 77 L42 79" stroke-width="1"/>
    </svg>

    <!-- Top Right Cobweb -->
    <svg class="absolute top-0 right-0 w-28 h-28 md:w-36 md:h-36 opacity-25 text-stone-900 transform scale-x-[-1]" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.4">
      <path d="M0 0 L100 0 M0 0 L0 100 M0 0 L95 35 M0 0 L75 75 M0 0 L35 95"/>
      <path d="M22 0 Q20 20 0 22 M44 0 Q38 38 0 44 M68 0 Q56 56 0 68 M90 0 Q74 74 0 90"/>
    </svg>

    <!-- Floating Spooky Bats -->
    <div class="bat-float absolute top-6 left-[18%] hidden sm:block opacity-75">
      <svg width="36" height="20" viewBox="0 0 60 30" fill="#1b312e">
        <path d="M30 12 C27 8, 25 6, 25 3 L23 8 C14 2, 4 5, 0 16 C6 14, 11 16, 15 21 C18 17, 23 18, 26 23 C28 21, 32 21, 34 23 C37 18, 42 17, 45 21 C49 16, 54 14, 60 16 C56 5, 46 2, 37 8 L35 3 C35 6, 33 8, 30 12 Z"/>
        <circle cx="28" cy="11" r="1.3" fill="#ff7518"/>
        <circle cx="32" cy="11" r="1.3" fill="#ff7518"/>
      </svg>
    </div>

    <div class="bat-float-delayed absolute top-10 right-[20%] hidden sm:block opacity-70">
      <svg width="28" height="16" viewBox="0 0 60 30" fill="#1b312e">
        <path d="M30 12 C27 8, 25 6, 25 3 L23 8 C14 2, 4 5, 0 16 C6 14, 11 16, 15 21 C18 17, 23 18, 26 23 C28 21, 32 21, 34 23 C37 18, 42 17, 45 21 C49 16, 54 14, 60 16 C56 5, 46 2, 37 8 L35 3 C35 6, 33 8, 30 12 Z"/>
        <circle cx="28" cy="11" r="1.3" fill="#ff7518"/>
        <circle cx="32" cy="11" r="1.3" fill="#ff7518"/>
      </svg>
    </div>
  </div>

  <!-- MAIN APPLICATION CONTAINER -->
  <div id="appRoot" class="relative z-10 w-full min-h-screen flex flex-col"></div>

  <!-- FLOATING BOTTOM RIGHT CONTROLS (CHAT & MENU) -->
  <div id="floatingControls" class="fixed bottom-4 right-4 z-50 flex items-center gap-2.5"></div>

  <!-- MODAL LAYER -->
  <div id="modalLayer" class="fixed inset-0 z-50 pointer-events-none flex items-center justify-center p-4"></div>

  <!-- CUTSCENE OVERLAY LAYER (3S CARD FREEZE & 10S NIGHT GOBLIN RAID) -->
  <div id="cutsceneLayer" class="fixed inset-0 z-[60] pointer-events-none"></div>

  <!-- TOAST NOTIFICATION BANNER -->
  <div id="toastContainer" class="fixed top-4 left-1/2 -translate-x-1/2 z-[70] flex flex-col items-center gap-2 pointer-events-none"></div>

  <script type="module">
    // ============================================================================
    // 1. CUSTOM SVG ASSETS (HALLOWEEN CANDY, PUMPKIN ACCUSATION, CARD BACKS, AVATARS)
    // ============================================================================

    // Wrapped Oval Striped Halloween Candy (Matches Pic 2 Blue/Yellow Candy Shape in Purple & Orange)
    function renderCandySVG(size = 24, extraClass = '') {
      if (!state.settings.halloweenTheme) {
        // Classic Gold Coin fallback if user toggles Halloween off
        return `
          <svg width="${size}" height="${size}" class="inline-block shrink-0 ${extraClass}" viewBox="0 0 32 32">
            <circle cx="16" cy="17" r="12" fill="#8b6914" stroke="#1b312e" stroke-width="2.2"/>
            <circle cx="16" cy="15" r="12" fill="#e5b842" stroke="#1b312e" stroke-width="2.2"/>
            <line x1="8" y1="11" x2="23" y2="19" stroke="#1b312e" stroke-width="1.8"/>
          </svg>
        `;
      }
      return `
        <svg width="${size * 1.25}" height="${size}" class="inline-block shrink-0 ${extraClass}" viewBox="0 0 64 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Left Wrapper Twist (Vibrant Purple) -->
          <path d="M16 20 C11 10, 6 9, 3 15 C1 19, 4 23, 2 27 C1 31, 6 35, 14 29 Z" fill="#8b3dff" stroke="#141414" stroke-width="2.8" stroke-linejoin="round"/>
          <path d="M8 18 L14 22 M7 25 L14 25" stroke="#141414" stroke-width="2" stroke-linecap="round"/>
          <!-- Right Wrapper Twist (Vibrant Purple) -->
          <path d="M48 20 C53 10, 58 9, 61 15 C63 19, 60 23, 62 27 C63 31, 58 35, 50 29 Z" fill="#8b3dff" stroke="#141414" stroke-width="2.8" stroke-linejoin="round"/>
          <path d="M56 18 L50 22 M57 25 L50 25" stroke="#141414" stroke-width="2" stroke-linecap="round"/>
          <!-- Center Oval Candy Body (Orange & Purple Stripes) -->
          <defs>
            <clipPath id="candyBodyClip">
              <ellipse cx="32" cy="24" rx="18" ry="13.5"/>
            </clipPath>
          </defs>
          <g clip-path="url(#candyBodyClip)">
            <rect x="12" y="8" width="40" height="32" fill="#ff7518"/>
            <!-- Purple Stripes -->
            <path d="M18 6 L12 42 L20 42 L26 6 Z" fill="#8b3dff"/>
            <path d="M31 6 L25 42 L34 42 L40 6 Z" fill="#8b3dff"/>
            <path d="M44 6 L38 42 L46 42 L52 6 Z" fill="#8b3dff"/>
            <!-- Bottom Shading -->
            <path d="M14 29 Q32 39 50 29 L50 40 L14 40 Z" fill="rgba(0,0,0,0.16)"/>
            <!-- Glossy Highlights -->
            <ellipse cx="28" cy="15" rx="7" ry="2.5" transform="rotate(-8 28 15)" fill="rgba(255,255,255,0.65)"/>
            <ellipse cx="40" cy="18" rx="3" ry="1.8" transform="rotate(12 40 18)" fill="rgba(255,255,255,0.55)"/>
          </g>
          <ellipse cx="32" cy="24" rx="18" ry="13.5" stroke="#141414" stroke-width="3"/>
        </svg>
      `;
    }

    // Jack-o'-Lantern Pumpkin Accusation Icon (Matches Pic 3 Pumpkin with curly stem & triangle eyes)
    function renderPumpkinSVG(size = 24, extraClass = '') {
      if (!state.settings.halloweenTheme) {
        return `
          <svg width="${size}" height="${size}" class="inline-block shrink-0 ${extraClass}" viewBox="0 0 32 32">
            <circle cx="16" cy="17" r="11" fill="#184d27" stroke="#1b312e" stroke-width="2.2"/>
            <circle cx="16" cy="15" r="11" fill="#2f8546" stroke="#1b312e" stroke-width="2.2"/>
          </svg>
        `;
      }
      return `
        <svg width="${size}" height="${size}" class="inline-block shrink-0 ${extraClass}" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Curly Stem -->
          <path d="M27 20 C25 11, 32 7, 38 12 C43 16, 51 15, 51 8 C51 3, 44 2, 43 7" stroke="#121c24" stroke-width="5" stroke-linecap="round" fill="none"/>
          <path d="M25 21 Q32 16 39 21 Z" fill="#121c24"/>
          <!-- Pumpkin Body -->
          <rect x="6" y="19" width="52" height="39" rx="19" fill="#ff6d14" stroke="#121c24" stroke-width="3.2"/>
          <!-- Pumpkin Rib Lines -->
          <path d="M22 20 C16 30, 16 46, 22 57" stroke="#d95204" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M42 20 C48 30, 48 46, 42 57" stroke="#d95204" stroke-width="2.6" stroke-linecap="round"/>
          <!-- White Highlight -->
          <path d="M15 25 C11 32, 11 42, 13 48" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
          <!-- Carved Triangle Eyes & Nose -->
          <polygon points="21,29 15,39 26,39" fill="#121c24"/>
          <polygon points="43,29 38,39 49,39" fill="#121c24"/>
          <polygon points="32,37 28,44 36,44" fill="#121c24"/>
          <!-- Carved Toothy Smile -->
          <path d="M18 46 L25 48 L25 50 L30 50 L30 48 L35 48 L35 50 L39 50 L39 48 L46 46 C44 54, 20 54, 18 46 Z" fill="#121c24"/>
        </svg>
      `;
    }

    // Blue Miniature Gambit Card Icon (for player rows)
    function renderMiniCardSVG(size = 20) {
      return `
        <svg width="${size * 0.78}" height="${size}" class="inline-block shrink-0" viewBox="0 0 22 28">
          <rect x="1.5" y="1.5" width="19" height="25" rx="2.5" fill="#d9edf7" stroke="#1b312e" stroke-width="1.8"/>
          <rect x="4" y="4" width="14" height="20" rx="1.5" fill="#2c6f9e" stroke="#1b312e" stroke-width="1.2"/>
          <text x="11" y="17.5" text-anchor="middle" fill="#f3eee1" font-size="10" font-weight="bold" font-family="Georgia">G</text>
        </svg>
      `;
    }

    // Shield & Cloak Status Badges
    function renderShieldBadge(count = 1) {
      return `
        <span class="inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded bg-amber-100 border border-stone-800 text-[11px] font-bold text-stone-900" title="Protected by ${count} Shield(s)">
          🛡️${count > 1 ? count : ''}
        </span>
      `;
    }

    function renderCloakBadge() {
      return `
        <span class="inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded bg-teal-100 border border-stone-800 text-[11px] font-bold text-teal-950" title="Cloaked until next day">
          🧥CLOAK
        </span>
      `;
    }

    // 19 Exact Medieval/Fantasy Avatars (Matches Pic 6 / Pic 15: Choose Your Avatar 5-row grid)
    const AVATARS = [
      // Row 1
      { id: 0,  name: 'Alchemist',              border: '#2f8546', type: 'alchemist' },
      { id: 1,  name: 'Red King',               border: '#c83e2b', type: 'king' },
      { id: 2,  name: 'Red Dragon',             border: '#c83e2b', type: 'dragon' },
      { id: 3,  name: 'Robin Hood Archer',      border: '#2f8546', type: 'robinhood' },
      // Row 2
      { id: 4,  name: 'Testify Scroll Noble',   border: '#d9a738', type: 'testify' },
      { id: 5,  name: 'Blue Wizard',            border: '#233fc8', type: 'wizard' },
      { id: 6,  name: 'Blue Plumed Visor',      border: '#233fc8', type: 'knight_plume', accent: '#233fc8' },
      { id: 7,  name: 'Blue Great Helm',        border: '#233fc8', type: 'knight_great', accent: '#233fc8' },
      // Row 3
      { id: 8,  name: 'Blue Hooded Coif',       border: '#233fc8', type: 'knight_coif',  accent: '#233fc8' },
      { id: 9,  name: 'Blue Tilting Helm',      border: '#233fc8', type: 'knight_tilt',  accent: '#233fc8' },
      { id: 10, name: 'Green Plumed Visor',     border: '#2f8546', type: 'knight_plume', accent: '#2f8546' },
      { id: 11, name: 'Green Great Helm',       border: '#2f8546', type: 'knight_great', accent: '#2f8546' },
      // Row 4
      { id: 12, name: 'Green Hooded Coif',      border: '#2f8546', type: 'knight_coif',  accent: '#2f8546' },
      { id: 13, name: 'Red Plumed Visor',       border: '#c83e2b', type: 'knight_plume', accent: '#c83e2b' },
      { id: 14, name: 'Red Great Helm',         border: '#c83e2b', type: 'knight_great', accent: '#c83e2b' },
      { id: 15, name: 'Red Hooded Coif',        border: '#c83e2b', type: 'knight_coif',  accent: '#c83e2b' },
      // Row 5
      { id: 16, name: 'Yellow Plumed Visor',    border: '#d9a738', type: 'knight_plume', accent: '#d9a738' },
      { id: 17, name: 'Yellow Great Helm',      border: '#d9a738', type: 'knight_great', accent: '#d9a738' },
      { id: 18, name: 'Yellow Hooded Coif',     border: '#d9a738', type: 'knight_coif',  accent: '#d9a738' }
    ];

    function renderAvatarSVG(avatarId = 0, size = 40) {
      const av = AVATARS[avatarId % AVATARS.length] || AVATARS[0];
      let innerArt = '';

      if (av.type === 'alchemist') {
        innerArt = `
          <!-- Green tunic + orange apron + raised potion flask -->
          <path d="M10 46 C10 33, 38 33, 38 46 Z" fill="#18703b" stroke="#1b312e" stroke-width="2"/>
          <rect x="17" y="34" width="14" height="12" fill="#e06d1f" stroke="#1b312e" stroke-width="1.6"/>
          <circle cx="25" cy="23" r="6.5" fill="#f2cbb2" stroke="#1b312e" stroke-width="1.8"/>
          <path d="M18 20 C18 14, 32 14, 32 20 C30 17, 20 17, 18 20 Z" fill="#5c3824" stroke="#1b312e" stroke-width="1.6"/>
          <circle cx="12" cy="16" r="5" fill="#d9edf7" stroke="#1b312e" stroke-width="1.6"/>
          <path d="M8 17 Q12 21 16 17 A4 4 0 0 1 8 17 Z" fill="#e04696"/>
          <path d="M10 34 C8 26, 10 21, 12 20" stroke="#18703b" stroke-width="4" stroke-linecap="round"/>
        `;
      } else if (av.type === 'king') {
        innerArt = `
          <!-- Crowned King in red cape & blue tunic -->
          <path d="M8 46 C9 31, 39 31, 40 46 Z" fill="#c83226" stroke="#1b312e" stroke-width="2"/>
          <path d="M22 33 L34 33 L36 46 L22 46 Z" fill="#2b549e" stroke="#1b312e" stroke-width="1.6"/>
          <path d="M12 32 Q24 36 36 32" stroke="#f5f2eb" stroke-width="4" stroke-linecap="round"/>
          <circle cx="24" cy="21" r="6.5" fill="#f2cbb2" stroke="#1b312e" stroke-width="1.8"/>
          <path d="M19 24 C21 28, 28 28, 29 23" fill="#4a3728"/>
          <polygon points="17,15 19,9 24,13 29,9 31,15" fill="#e5b842" stroke="#1b312e" stroke-width="1.6"/>
        `;
      } else if (av.type === 'dragon') {
        innerArt = `
          <!-- Red Winged Dragon perched on gold -->
          <ellipse cx="24" cy="43" rx="16" ry="4.5" fill="#e5b842" stroke="#1b312e" stroke-width="1.6"/>
          <path d="M8 28 Q16 16 22 28 Z" fill="#9e1f1f" stroke="#1b312e" stroke-width="1.6"/>

    // Sound Synthesizer (Web Audio API - No external audio files required)
    function playSoundEffect(type) {
      if (!state.settings.sound) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;
        if (type === 'click') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(240, now + 0.06);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.06);
          osc.start(now);
          osc.stop(now + 0.06);
        } else if (type === 'candy') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.setValueAtTime(880, now + 0.07);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
          osc.start(now);
          osc.stop(now + 0.18);
        } else if (type === 'accuse') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(210, now);
          osc.frequency.linearRampToValueAtTime(110, now + 0.25);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'night') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(310, now);
          osc.frequency.exponentialRampToValueAtTime(155, now + 0.45);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.45);
          osc.start(now);
          osc.stop(now + 0.45);
        } else if (type === 'slash') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(680, now);
          osc.frequency.exponentialRampToValueAtTime(90, now + 0.32);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.32);
          osc.start(now);
          osc.stop(now + 0.32);
        } else if (type === 'raid_cackle') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(420, now);
          osc.frequency.setValueAtTime(540, now + 0.08);
          osc.frequency.setValueAtTime(380, now + 0.16);
          osc.frequency.setValueAtTime(610, now + 0.24);

          gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        }
      } catch (e) {}
    }

        const elapsed = Date.now() - startTime;
        const pct = Math.min(100, Math.round((elapsed / durationMs) * 100));
        const secLeft = Math.max(0, Math.ceil((durationMs - elapsed) / 1000));
        state.nightRaidCutscene.progressPct = pct;
        state.nightRaidCutscene.secondsLeft = secLeft;

        if (elapsed >= durationMs) {
          finishNightRaidCutscene();
        } else {
          renderCutsceneLayer();
        }
      }, 200);
    }

                    <div class="goblin-raider-hop -mb-2 z-30 flex items-center gap-0.5 bg-orange-600 text-white px-2 py-0.5 rounded-full border border-stone-900 shadow-lg text-[10px] font-heading font-bold">
                      <span>👺+${hitInfo.count}</span>
                      ${renderPumpkinSVG(18)}
                    </div>
                  ` : ''}

                  <div class="p-1.5 rounded-xl border-2 transition-all duration-300 ${showPumpkinHit ? 'border-orange-500 bg-orange-950/90 scale-110 shadow-[0_0_25px_rgba(255,117,24,0.85)]' : 'border-stone-600 bg-[#132840]/90'} ${!p.alive ? 'opacity-40' : ''}">
                    ${renderAvatarSVG(p.avatarId, 38)}
                  </div>
                  <span class="font-heading text-[10px] font-bold mt-1 px-1.5 py-0.5 rounded bg-black/70 text-amber-100 whitespace-nowrap">
                    #${idx + 1} ${p.name}
                  </span>
                  ${showElimSkull ? `
                    <span class="mt-0.5 px-2 py-0.5 rounded bg-red-700 text-white font-heading text-[9px] font-bold animate-bounce">
                      💀 ELIMINATED (${p.role})!
                    </span>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </div>

          <!-- Bottom Skip Button -->
          <div class="z-20">
            <button data-action="skip-night-raid" class="sketch-btn btn-gold px-6 py-2.5 text-xs">
              SKIP ANIMATION (${secondsLeft}S) ›
            </button>
          </div>
        `;
        return;
      }

      layer.className = 'fixed inset-0 z-[60] pointer-events-none';
      layer.innerHTML = '';
    }

    function showToast(msg) {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const el = document.createElement('div');
      el.className = 'sketch-box px-4 py-2 bg-[#16423c] text-[#f3eee1] font-heading text-xs md:text-sm shadow-lg transition-all';
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 300);
      }, 2700);
    }

    // Broadcast room updates across browser tabs so the user can test multiple human viewpoints live
    function broadcastRoomState() {
      if (syncChannel) {
        syncChannel.postMessage({ type: 'ROOM_SYNC', room: JSON.parse(JSON.stringify(state.room)) });
      }
    }

    if (syncChannel) {
      syncChannel.onmessage = (ev) => {
        if (ev.data && ev.data.type === 'ROOM_SYNC' && ev.data.room.code === state.room.code) {
          const prevPhase = state.room.phase;
          state.room = ev.data.room;
          if (state.room.phase !== prevPhase) {
            syncScreenToRoomPhase();
          }
          renderApp();
        }
      };
    }

    function syncScreenToRoomPhase() {
      const p = state.room.phase;
      if (p === 'lobby') state.screen = 'lobby';
      else if (p === 'countdown') state.screen = 'countdown';
      else if (p === 'how_to_play') state.screen = 'how_to_play';
      else if (p === 'role_reveal') state.screen = 'role_reveal';
      else if (p === 'day' || p === 'night' || p === 'gameover') state.screen = 'game';
    }

    // ============================================================================
    // 4. LOBBY, DECK & GAME ENGINE FUNCTIONS
    // ============================================================================
    function generateRoomCode() {
      const wordsA = ['CROW', 'HAZE', 'HOOK', 'BONE', 'MOON', 'GRIM', 'BREW', 'TOMB', 'DUSK', 'FANG'];
      const wordsB = ['CARE', 'FONT', 'MIST', 'WARD', 'GLOW', 'VEIL', 'KEEP', 'BELL', 'ROOT', 'LORE'];
      return `${wordsA[Math.floor(Math.random() * wordsA.length)]}-${wordsB[Math.floor(Math.random() * wordsB.length)]}`;
    }

    function initLobby(code = generateRoomCode(), isPublic = true, addStarterBots = false) {
      state.room.code = code;
      state.room.isPublic = isPublic;
      state.room.hostId = myClientId;
      state.room.phase = 'lobby';
      state.room.players = [
        {
          id: myClientId,
          name: (state.username || 'ETHANZ').toUpperCase(),
          avatarId: state.avatarId,
          isHost: true,
          isBot: false,
          ready: true,
          role: 'HERO',
          roleRevealedToPublic: false,
          alive: true,
          gold: 1,
          hand: [],
          accusations: 0,
          threshold: 3,
          shields: 0,
          cloaked: false,
          accusedThisTurnByActive: 0
        }
      ];

      if (addStarterBots) {
        const botNames = ['A', 'AB', 'ABC', 'ABCD'];
        botNames.forEach((bName, idx) => {
          state.room.players.push({
            id: 'bot_' + idx + '_' + Math.random().toString(36).substring(2, 6),
            name: bName,
            avatarId: (idx + 1) % AVATARS.length,
            isHost: false,
            isBot: true,
            ready: true,
            role: 'HERO',
            roleRevealedToPublic: false,
            alive: true,
            gold: 1,
            hand: [],
            accusations: 0,
            threshold: 3,
            shields: 0,
            cloaked: false,
            accusedThisTurnByActive: 0
          });
        });
      }

      state.screen = 'lobby';
      broadcastRoomState();
      renderApp();
    }

    function addBotToLobby() {
      if (state.room.players.length >= 16) {
        showToast('MAXIMUM 16 PLAYERS REACHED');
        return;
      }
      const existingNames = new Set(state.room.players.map(p => p.name));
      const pool = ['A', 'AB', 'ABC', 'ABCD', 'SALEM', 'BINX', 'RAVEN', 'VLAD', 'MORGAN', 'GHOST', 'PUMPKIN', 'HEX', 'SPIKE', 'WILLOW', 'THORN'];
      let chosen = pool.find(n => !existingNames.has(n)) || ('GOBLIN-' + (state.room.players.length + 1));

      state.room.players.push({
        id: 'bot_' + Date.now() + '_' + Math.random().toString(36).substring(2, 5),
        name: chosen,
        avatarId: (state.room.players.length * 2 + 1) % AVATARS.length,
        isHost: false,
        isBot: true,
        ready: true,
        role: 'HERO',
        roleRevealedToPublic: false,
        alive: true,
        gold: 1,
        hand: [],
        accusations: 0,
        threshold: 3,
        shields: 0,
        cloaked: false,
        accusedThisTurnByActive: 0
      });
      playSoundEffect('click');
      broadcastRoomState();
      renderApp();
    }

    function buildFullDeck() {
      const deck = [];
      CARD_LIBRARY.forEach(cardDef => {
        for (let i = 0; i < cardDef.copies; i++) {
          deck.push(cardDef.id);
        }
      });
      // Fisher-Yates shuffle
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      return deck;
    }

    function drawCardFromDeck() {
      if (state.room.deck.length === 0) {
        if (state.room.discardPile.length > 0) {
          state.room.deck = [...state.room.discardPile];
          state.room.discardPile = [];
          for (let i = state.room.deck.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [state.room.deck[i], state.room.deck[j]] = [state.room.deck[j], state.room.deck[i]];
          }
        } else {
          state.room.deck = buildFullDeck();
        }
      }
      return state.room.deck.pop();
    }

    let countdownInterval = null;

    function startPreGameCountdown() {
      if (state.room.players.length < 5) {
        showToast('NEED AT LEAST 5 PLAYERS TO START (CLICK "+ ADD BOT" TO FILL SEATS)');
        return;
      }
      state.room.phase = 'countdown';
      state.room.countdownSec = 3;
      state.screen = 'countdown';
      playSoundEffect('click');
      broadcastRoomState();
      renderApp();

      clearInterval(countdownInterval);
      countdownInterval = setInterval(() => {
        state.room.countdownSec -= 1;
        if (state.room.countdownSec <= 0) {
          clearInterval(countdownInterval);
          setupNewMatch();
        } else {
          playSoundEffect('click');
          broadcastRoomState();
          renderApp();
        }
      }, 950);
    }

    function cancelPreGameCountdown() {
      clearInterval(countdownInterval);
      state.room.phase = 'lobby';
      state.screen = 'lobby';
      broadcastRoomState();
      renderApp();
    }

    function setupNewMatch() {
      const count = Math.min(16, Math.max(5, state.room.players.length));
      const dist = ROLE_DISTRIBUTION[count] || { heroes: 3, goblins: 2 };
      const roles = [];
      for (let i = 0; i < dist.heroes; i++) roles.push('HERO');
      for (let i = 0; i < dist.goblins; i++) roles.push('GOBLIN');
      for (let i = roles.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [roles[i], roles[j]] = [roles[j], roles[i]];
      }

      state.room.deck = buildFullDeck();
      state.room.discardPile = [];
      state.room.playedCardsHistory = [];
      state.room.historyLog = [];
      state.room.linkedPair = [];
      state.room.dragon = null;
      state.room.winner = null;
      state.room.dayNumber = 1;
      state.room.turnIndex = 0;
      state.room.turnStep = 1;
      state.room.turnsLeftInRound = count;
      state.room.commonwealth = count * 2; // 2 gold per player to start
      state.room.lastActionBanner = '';
      state.roleRevealed = false;

      state.room.players.forEach((p, idx) => {
        p.role = roles[idx] || 'HERO';
        p.roleRevealedToPublic = false;
        p.alive = true;
        p.gold = 1; // Each player starts with 1 gold and 2 Gambit cards
        p.hand = [drawCardFromDeck(), drawCardFromDeck()];
        p.accusations = 0;
        p.threshold = 3;
        p.shields = 0;
        p.cloaked = false;
        p.accusedThisTurnByActive = 0;
      });

      state.room.phase = 'how_to_play';
      state.screen = 'how_to_play';
      broadcastRoomState();
      renderApp();
    }

    function addLogEntry(text) {
      state.room.historyLog.unshift({
        id: 'log_' + Date.now() + '_' + Math.random().toString(36).substring(2, 5),
        text: text.toUpperCase()
      });
      state.room.lastActionBanner = text.toUpperCase();
    }

    // Check Victory Conditions (Heroes eliminate all Goblins OR Goblins eliminate all Heroes OR Goblins reach Gold Goal)
    function checkWinConditions() {
      if (state.room.winner) return true;
      const livingGoblins = state.room.players.filter(p => p.alive && p.role === 'GOBLIN');
      const livingHeroes = state.room.players.filter(p => p.alive && p.role === 'HERO');

      if (livingGoblins.length === 0) {
        state.room.winner = {
          team: 'HEROES',
          reason: 'ALL GOBLINS HAVE BEEN EXPOSED AND ELIMINATED!'
        };
        state.room.phase = 'gameover';
        addLogEntry('HEROES WIN! ALL GOBLINS ELIMINATED.');
        broadcastRoomState();
        renderApp();
        return true;
      }

      if (livingHeroes.length === 0) {
        state.room.winner = {
          team: 'GOBLINS',
          reason: 'ALL HEROES HAVE BEEN ELIMINATED!'
        };
        state.room.phase = 'gameover';
        addLogEntry('GOBLINS WIN! ALL HEROES ELIMINATED.');
        broadcastRoomState();
        renderApp();
        return true;
      }

      // Check Goblin Gold/Candy Stash Goal
      const totalGoblinGold = livingGoblins.reduce((sum, g) => sum + g.gold, 0);
      const targetGold = livingGoblins.length * state.room.goblinGoldGoal;
      if (livingGoblins.length > 0 && totalGoblinGold >= targetGold) {
        state.room.winner = {
          team: 'GOBLINS',
          reason: `SURVIVING GOBLINS HOARDED ${totalGoblinGold} CANDY/GOLD (GOAL: ${targetGold})!`
        };
        state.room.phase = 'gameover';
        addLogEntry(`GOBLINS WIN EARLY BY STASHING ${totalGoblinGold} CANDY/GOLD!`);
        broadcastRoomState();
        renderApp();
        return true;
      }

      return false;
    }

    // Apply Accusations to a Player (Handles Cloak, Shield, Extra Life / King, Elimination, and Linked Partner)
    function applyAccusationToPlayer(targetPlayer, count = 1, sourceLabel = '') {
      if (!targetPlayer || !targetPlayer.alive) return;

      if (targetPlayer.cloaked) {
        addLogEntry(`${targetPlayer.name} IS CLOAKED AND CANNOT RECEIVE ACCUSATIONS.`);
        return;
      }

      for (let i = 0; i < count; i++) {
        if (!targetPlayer.alive) break;
        if (targetPlayer.shields > 0) {
          targetPlayer.shields -= 1;
          addLogEntry(`${targetPlayer.name}'S SHIELD BLOCKED 1 ACCUSATION!`);
        } else {
          targetPlayer.accusations += 1;
          playSoundEffect('accuse');
          checkPlayerEliminationThreshold(targetPlayer);
        }
      }
      checkWinConditions();
    }

    function checkPlayerEliminationThreshold(targetPlayer) {
      if (targetPlayer.accusations < targetPlayer.threshold) return;

      // Check if targetPlayer or any player has Extra Life (5G) or King (7G) in hand and enough gold
      // For smooth gameplay, if the human player holds Extra Life or King and can afford it, or if target is bot with it:
      const me = getMyPlayer();
      if (me && me.alive && targetPlayer.threshold === 3) {
        const hasKing = me.hand.includes('king') && me.gold >= 7;
        const hasExtra = me.hand.includes('extralife') && me.gold >= 5;
        if (hasKing || hasExtra) {
          // Automatically offer or trigger if it's yourself, or show modal
          state.activeModal = 'reaction_prompt';
          state.pendingReactionTargetId = targetPlayer.id;
          renderApp();
          return;
        }
      }

      eliminatePlayer(targetPlayer, false);
    }

    function eliminatePlayer(targetPlayer, bypassCloakOnLink = false) {
      if (!targetPlayer || !targetPlayer.alive) return;
      targetPlayer.alive = false;
      targetPlayer.roleRevealedToPublic = true;
      addLogEntry(`${targetPlayer.name} IS ELIMINATED! ROLE REVEALED: ${targetPlayer.role}.`);

      // Check Linked Partner
      if (state.room.linkedPair && state.room.linkedPair.includes(targetPlayer.id)) {
        const partnerId = state.room.linkedPair.find(id => id !== targetPlayer.id);
        const partner = state.room.players.find(p => p.id === partnerId);
        state.room.linkedPair = [];
        if (partner && partner.alive) {
          if (partner.cloaked && !bypassCloakOnLink) {
            addLogEntry(`${partner.name} SURVIVED LINKED ELIMINATION THANKS TO CLOAK!`);
          } else {
            partner.alive = false;
            partner.roleRevealedToPublic = true;
            addLogEntry(`${partner.name} WAS LINKED TO ${targetPlayer.name} AND IS ELIMINATED TOO (${partner.role})!`);
          }
        }
      }
    }

    function getMyPlayer() {
      return state.room.players.find(p => p.id === myClientId) || state.room.players[0];
    }

    function getActiveTurnPlayer() {
      return state.room.players[state.room.turnIndex] || state.room.players[0];
    }

    // ============================================================================
    // 5. TURN PROGRESSION (STEP 1 COMMONWEALTH -> STEP 2 GAMBIT CARDS -> NIGHT)
    // ============================================================================
    function confirmStep1Commonwealth() {
      const active = getActiveTurnPlayer();
      if (!active) return;

      let delta = parseInt(state.step1Amount, 10);
      if (delta > 0) {
        const actualTake = Math.min(delta, state.room.commonwealth, 4);
        active.gold += actualTake;
        state.room.commonwealth -= actualTake;
        addLogEntry(`${active.name} TAKES ${actualTake} GOLD FROM THE COMMONWEALTH.`);
      } else if (delta < 0) {
        const contribute = Math.min(Math.abs(delta), active.gold, 2);
        active.gold -= contribute;
        state.room.commonwealth += contribute;
        addLogEntry(`${active.name} CONTRIBUTES ${contribute} GOLD TO THE COMMONWEALTH.`);
      } else {
        addLogEntry(`${active.name} TAKES 0 GOLD FROM THE COMMONWEALTH.`);
      }

      playSoundEffect('candy');
      state.room.turnStep = 2;
      state.step1Amount = 2; // reset default for next player
      checkWinConditions();
      broadcastRoomState();
      renderApp();
    }

    function endCurrentPlayerTurn() {
      const active = getActiveTurnPlayer();
      if (!active) return;

      // Enforce 3-card maximum hand size at end of turn
      if (active.id === myClientId && active.hand.length > 3) {
        showToast(`YOU HOLD ${active.hand.length} CARDS! PLAY OR CYCLE DOWN TO 3 OR FEWER BEFORE ENDING TURN.`);
        return;
      }
      while (active.hand.length > 3) {
        state.room.discardPile.push(active.hand.pop());
      }

      // Reset per-turn Accuse tier counters
      state.room.players.forEach(p => { p.accusedThisTurnByActive = 0; });
      state.cycleMode = false;

      if (checkWinConditions()) return;

      // Decrement remaining turns in this Day round
      state.room.turnsLeftInRound -= 1;
      if (state.room.turnsLeftInRound <= 0) {
        enterNightPhase();
        return;
      }

      // Advance clockwise to next living player
      const total = state.room.players.length;
      let nextIdx = (state.room.turnIndex + 1) % total;
      for (let i = 0; i < total; i++) {
        if (state.room.players[nextIdx].alive) break;
        nextIdx = (nextIdx + 1) % total;
      }

      state.room.turnIndex = nextIdx;
      state.room.turnStep = 1;
      state.step1Amount = Math.min(2, state.room.commonwealth);
      broadcastRoomState();
      renderApp();
      maybeRunBotTurn();
    }

    function enterNightPhase() {
      state.room.phase = 'night';
      state.room.nightVotes = {};
      playSoundEffect('night');

      // Initialize Goblin night allocation state
      const maxAcc = getNightAccusationQuota();
      const livingPlayers = state.room.players.filter(p => p.alive);
      const livingHeroes = livingPlayers.filter(p => p.role === 'HERO');

      state.room.players.filter(p => p.alive && p.role === 'GOBLIN').forEach(gob => {
        const alloc = {};
        if (gob.isBot && livingHeroes.length > 0) {
          // Bots pre-allocate accusations onto a Hero so solo players can see or override
          const target = livingHeroes[0];
          alloc[target.id] = maxAcc;
        }
        state.room.nightVotes[gob.id] = {
          allocations: alloc,
          confirmed: gob.isBot ? true : false
        };
      });

      addLogEntry(`DAY ${state.room.dayNumber} IS OVER. NIGHT ${state.room.dayNumber} BEGINS...`);
      broadcastRoomState();
      renderApp();

      // If the human player is a Hero (or spectator), resolve Night automatically after a short suspense delay
      const me = getMyPlayer();
      if (!me || me.role !== 'GOBLIN' || !me.alive) {
        setTimeout(() => {
          if (state.room.phase === 'night') {
            resolveNightPhaseAccusations();
          }
        }, 2800);
      }
    }

    function getNightAccusationQuota() {
      if (state.room.dayNumber === 1) return 1;
      if (state.room.dayNumber === 2) return 2;
      return 3;
    }

    function resolveNightPhaseAccusations() {
      const me = getMyPlayer();
      const goblinVoter = (me && me.alive && me.role === 'GOBLIN' && state.room.nightVotes[me.id])
        ? state.room.nightVotes[me.id]
        : Object.values(state.room.nightVotes)[0];

      const allocations = goblinVoter ? goblinVoter.allocations : {};
      const raidTargets = [];

      Object.entries(allocations).forEach(([targetId, count]) => {
        if (count > 0) {
          const target = state.room.players.find(p => p.id === targetId);
          if (target && target.alive) {
            const effectiveHits = target.cloaked ? 0 : Math.max(0, count - target.shields);
            const willEliminate = (target.accusations + effectiveHits) >= target.threshold;
            raidTargets.push({
              id: target.id,
              name: target.name,
              avatarId: target.avatarId,
              count,
              willEliminate
            });
          }
        }
      });

      // Trigger the 10-second Post-Night Goblin Raid Cutscene Animation before starting the next Day!
      triggerPostNightGoblinRaidCutscene(raidTargets, () => {
        Object.entries(allocations).forEach(([targetId, count]) => {
          if (count > 0) {
            const target = state.room.players.find(p => p.id === targetId);
            if (target && target.alive) {
              addLogEntry(`IN THE NIGHT, GOBLINS PLACED ${count} ACCUSATION(S) ON ${target.name}.`);
              applyAccusationToPlayer(target, count, 'NIGHT GOBLINS');
            }
          }
        });

        if (checkWinConditions()) return;

        // Start Next Morning!
        state.room.dayNumber += 1;
        state.room.phase = 'day';

        // Clear Cloak effects at start of new day; surviving players draw 1 card; add 2 gold per surviving player
        const survivors = state.room.players.filter(p => p.alive);
        survivors.forEach(p => {
          p.cloaked = false;
          p.accusedThisTurnByActive = 0;
          p.hand.push(drawCardFromDeck());
        });

        const morningGold = survivors.length * 2;
        state.room.commonwealth += morningGold;
        state.room.turnsLeftInRound = survivors.length;

        // Rotate starting player clockwise
        const total = state.room.players.length;
        let startIdx = state.room.dayNumber % total;
        for (let i = 0; i < total; i++) {
          if (state.room.players[startIdx].alive) break;
          startIdx = (startIdx + 1) % total;
        }
        state.room.turnIndex = startIdx;
        state.room.turnStep = 1;
        state.step1Amount = Math.min(2, state.room.commonwealth);

        addLogEntry(`DAY ${state.room.dayNumber} BEGINS. +${morningGold} GOLD ADDED TO COMMONWEALTH.`);
        broadcastRoomState();
        renderApp();
        maybeRunBotTurn();
      });
    }

    // Automated Smart Bot Turn Logic so Solo/Small-Group Games Play Fluidly
    function maybeRunBotTurn() {
      if (state.room.phase !== 'day') return;
      const active = getActiveTurnPlayer();
      if (!active || !active.isBot || !active.alive) return;

      setTimeout(() => {
        if (state.room.phase !== 'day' || getActiveTurnPlayer()?.id !== active.id) return;

        // Bot Step 1: Take 2 gold (or up to 3 if Goblin)
        const desired = (active.role === 'GOBLIN' && Math.random() > 0.5) ? 3 : 2;
        state.step1Amount = Math.min(desired, state.room.commonwealth);
        confirmStep1Commonwealth();

        setTimeout(() => {
          if (state.room.phase !== 'day' || getActiveTurnPlayer()?.id !== active.id) return;
          // Bot Step 2: Possibly play a free card or Accuse with 3-second card animation!
          const accuseIdx = active.hand.indexOf('accuse');
          if (accuseIdx !== -1 && Math.random() > 0.35) {
            const candidates = state.room.players.filter(p => p.alive && p.id !== active.id && !p.cloaked && (active.role !== 'GOBLIN' || p.role !== 'GOBLIN'));
            if (candidates.length > 0) {
              const target = candidates[Math.floor(Math.random() * candidates.length)];
              active.hand.splice(accuseIdx, 1);
              state.room.discardPile.push('accuse');
              state.room.playedCardsHistory.push('accuse');
              addLogEntry(`${active.name} PLAYS ACCUSE ON ${target.name}.`);
              applyAccusationToPlayer(target, 1, active.name);
              broadcastRoomState();
              renderApp();
              triggerCardCutscene(active.name, 'accuse', target.name, () => {
                if (state.room.phase === 'day') endCurrentPlayerTurn();
              });
              return;
            }
          }
          if (state.room.phase === 'day') {
            endCurrentPlayerTurn();
          }
        }, 900);
      }, 850);
    }

    // ============================================================================
    // 6. PLAYING & CYCLING GAMBIT CARDS
    // ============================================================================
    function handleCardClickInHand(handIndex) {
      const me = getMyPlayer();
      const active = getActiveTurnPlayer();
      if (!me || !active || me.id !== active.id || state.room.phase !== 'day') {
        showToast('WAIT FOR YOUR TURN TO PLAY OR CYCLE CARDS');
        return;
      }
      if (state.room.turnStep !== 2) {
        showToast('COMPLETE STEP 1 (COMMONWEALTH) FIRST!');
        return;
      }

      const cardId = me.hand[handIndex];
      const cardDef = CARD_LIBRARY.find(c => c.id === cardId);
      if (!cardDef) return;

      // If Cycle Mode is active, pay 1 gold to discard and draw a new card
      if (state.cycleMode) {
        if (me.gold < 1) {
          showToast('NEED 1 CANDY/GOLD TO CYCLE A CARD');
          state.cycleMode = false;
          renderApp();
          return;
        }
        me.gold -= 1;
        me.hand.splice(handIndex, 1);
        state.room.discardPile.push(cardId);
        const fresh = drawCardFromDeck();
        me.hand.push(fresh);
        state.cycleMode = false;
        playSoundEffect('candy');
        addLogEntry(`${me.name} CYCLES A CARD FOR 1 GOLD.`);
        broadcastRoomState();
        renderApp();
        return;
      }

      // Immediate Non-Targeted Cards (Trigger 3s Freeze-Time Animation!)
      if (cardId === 'goldchest') {
        consumeCardFromHand(me, handIndex, cardId, 0);
        state.room.commonwealth += 3;
        addLogEntry(`${me.name} PLAYS GOLD CHEST (+3 GOLD TO COMMONWEALTH).`);
        broadcastRoomState();
        renderApp();
        triggerCardCutscene(me.name, 'goldchest', 'COMMONWEALTH');
        return;
      }

      if (cardId === 'goldcoins') {
        consumeCardFromHand(me, handIndex, cardId, 0);
        state.room.commonwealth += 2;
        addLogEntry(`${me.name} PLAYS GOLD COINS (+2 GOLD TO COMMONWEALTH).`);
        broadcastRoomState();
        renderApp();
        triggerCardCutscene(me.name, 'goldcoins', 'COMMONWEALTH');
        return;
      }

      if (cardId === 'testify') {
        if (me.gold < 7) {
          showToast('NEED 7 CANDY/GOLD TO PLAY TESTIFY');
          return;
        }
        consumeCardFromHand(me, handIndex, cardId, 7);
        me.roleRevealedToPublic = true;
        addLogEntry(`${me.name} PLAYS TESTIFY AND PUBLICLY REVEALS ROLE: ${me.role}!`);
        broadcastRoomState();
        renderApp();
        triggerCardCutscene(me.name, 'testify', `PUBLIC ROLE: ${me.role}`);
        return;
      }

      if (cardId === 'council') {
        if (me.gold < 4) {
          showToast('NEED 4 CANDY/GOLD TO CALL A COUNCIL');
          return;
        }
        consumeCardFromHand(me, handIndex, cardId, 4);
        state.room.councilState = {
          callerId: me.id,
          votes: {}
        };
        addLogEntry(`${me.name} PLAYS COUNCIL! GROUP DISCUSSION & VOTE BEGINS.`);
        triggerCardCutscene(me.name, 'council', 'ALL PLAYERS', () => {
          state.activeModal = 'council_vote';
          broadcastRoomState();
          renderApp();
        });
        return;
      }

      // Check minimum gold for targeted cards
      if (cardDef.cost > 0 && me.gold < cardDef.cost) {
        showToast(`NEED ${cardDef.cost} CANDY/GOLD TO PLAY ${cardDef.name}`);
        return;
      }

      // Open Target Selection Modal for Targeted Cards
      state.pendingCardPlay = {
        handIndex,
        cardId,
        cardDef,
        selectedTargets: [],
        drawnPreview: cardId === 'draw' ? [drawCardFromDeck(), drawCardFromDeck()] : null,
        keepCardIdx: 0
      };
      state.activeModal = 'card_target';
      renderApp();
    }

    function consumeCardFromHand(player, handIndex, cardId, goldCost) {
      player.gold -= goldCost;
      player.hand.splice(handIndex, 1);
      state.room.discardPile.push(cardId);
      if (cardId !== 'wizard') {
        state.room.playedCardsHistory.push(cardId);
      }
    }

    function executeTargetedCardPlay(targetId, secondTargetId = null) {
      const me = getMyPlayer();
      const pending = state.pendingCardPlay;
      if (!me || !pending) return;

      const { handIndex, cardId } = pending;
      const target = state.room.players.find(p => p.id === targetId);

      if (cardId === 'accuse') {
        if (targetId === 'DRAGON' && state.room.dragon) {
          consumeCardFromHand(me, handIndex, 'accuse', 0);
          state.room.dragon.accusations += 1;
          addLogEntry(`${me.name} PLAYS ACCUSE ON THE DRAGON (${state.room.dragon.accusations}/3).`);
          if (state.room.dragon.accusations >= 3) {
            const loot = state.room.dragon.gold;
            me.gold += loot;
            state.room.dragon = null;
            addLogEntry(`${me.name} SLAYS THE DRAGON AND CLAIMS ${loot} GOLD!`);
          }
        } else if (target) {
          const priorAcc = target.accusedThisTurnByActive || 0;
          const cost = priorAcc === 0 ? 0 : (priorAcc === 1 ? 3 : 5);
          if (me.gold < cost) {
            showToast(`ACCUSING ${target.name} A ${priorAcc + 1}ND/RD TIME THIS TURN COSTS ${cost} GOLD!`);
            return;
          }
          consumeCardFromHand(me, handIndex, 'accuse', cost);
          target.accusedThisTurnByActive = priorAcc + 1;
          addLogEntry(`${me.name} PLAYS ACCUSE ON ${target.name}.`);
          applyAccusationToPlayer(target, 1, me.name);
        }
      } else if (cardId === 'remove' && target) {
        consumeCardFromHand(me, handIndex, 'remove', 2);
        target.accusations = Math.max(0, target.accusations - 1);
        addLogEntry(`${me.name} PLAYS REMOVE ON ${target.name} (-1 ACCUSATION).`);
      } else if (cardId === 'alchemist' && target) {
        consumeCardFromHand(me, handIndex, 'alchemist', 3);
        const removed = target.accusations;
        target.accusations = 0;
        target.gold += removed * 2;
        addLogEntry(`${me.name} PLAYS ALCHEMIST ON ${target.name}, CONVERTING ${removed} ACCUSATIONS INTO ${removed * 2} GOLD!`);
      } else if (cardId === 'cloak' && target) {
        consumeCardFromHand(me, handIndex, 'cloak', 3);
        target.cloaked = true;
        addLogEntry(`${me.name} PLAYS CLOAK ON ${target.name}.`);
      } else if (cardId === 'shield' && target) {
        consumeCardFromHand(me, handIndex, 'shield', 3);
        target.shields += 1;
        addLogEntry(`${me.name} PLAYS SHIELD ON ${target.name}.`);
      } else if (cardId === 'dagger' && target) {
        consumeCardFromHand(me, handIndex, 'dagger', 8);
        addLogEntry(`${me.name} PLAYS DAGGER ON ${target.name}!`);
        eliminatePlayer(target, true);
      } else if (cardId === 'dragon' && target) {
        consumeCardFromHand(me, handIndex, 'dragon', 2);
        const stolen = Math.floor(target.gold / 2);
        target.gold -= stolen;
        if (!state.room.dragon) {
          state.room.dragon = { gold: stolen, accusations: 0 };
        } else {
          state.room.dragon.gold += stolen;
          state.room.dragon.accusations = 0;
        }
        addLogEntry(`${me.name} PLAYS DRAGON ON ${target.name}, PLACING ${stolen} GOLD ON THE DRAGON!`);
      } else if (cardId === 'reveal' && target) {
        consumeCardFromHand(me, handIndex, 'reveal', 7);
        addLogEntry(`${me.name} PLAYS REVEAL TO INSPECT ${target.name}'S ROLE CARD.`);
        showToast(`SECRET REVEAL: ${target.name}'S ROLE IS ${target.role}!`);
      } else if (cardId === 'extralife' && target) {
        consumeCardFromHand(me, handIndex, 'extralife', 5);
        target.threshold = 4;
        if (state.room.linkedPair.includes(target.id)) {
          state.room.linkedPair.forEach(id => {
            const p = state.room.players.find(pl => pl.id === id);
            if (p) p.threshold = 4;
          });
        }
        addLogEntry(`${me.name} PLAYS EXTRA LIFE ON ${target.name}! THRESHOLD RAISED TO 4.`);
      } else if (cardId === 'king' && target) {
        consumeCardFromHand(me, handIndex, 'king', 7);
        target.threshold = 4;
        target.accusations = 0;
        addLogEntry(`${me.name} PLAYS KING ON ${target.name}! THRESHOLD RAISED TO 4 & ACCUSATIONS CLEARED.`);
      } else if (cardId === 'draw' && target) {
        consumeCardFromHand(me, handIndex, 'draw', 1);
        const [c1, c2] = pending.drawnPreview;
        const kept = pending.keepCardIdx === 0 ? c1 : c2;
        const given = pending.keepCardIdx === 0 ? c2 : c1;
        me.hand.push(kept);
        target.hand.push(given);
        addLogEntry(`${me.name} PLAYS DRAW, KEEPS 1 CARD AND GIVES 1 CARD TO ${target.name}.`);
      } else if (cardId === 'linked' && target && secondTargetId) {
        const second = state.room.players.find(p => p.id === secondTargetId);
        if (second) {
          consumeCardFromHand(me, handIndex, 'linked', 3);
          state.room.linkedPair = [target.id, second.id];
          addLogEntry(`${me.name} PLAYS LINKED! ${target.name} AND ${second.name} ARE NOW LINKED.`);
        }
      } else if (cardId === 'robinhood' && target) {
        consumeCardFromHand(me, handIndex, 'robinhood', 0);
        const stolen = Math.min(3, target.gold);
        target.gold -= stolen;
        if (stolen > 0) me.gold += 1;
        const recipient = state.room.players.find(p => p.id === secondTargetId) || me;
        if (stolen > 1 && recipient) recipient.gold += (stolen - 1);
        addLogEntry(`${me.name} PLAYS ROBIN HOOD, STEALING ${stolen} GOLD FROM ${target.name} AND SHARING WITH ${recipient.name}!`);
      } else if (cardId === 'wizard') {
        // targetId here is the copied cardId
        const copiedDef = CARD_LIBRARY.find(c => c.id === targetId);
        if (copiedDef) {
          const discounted = Math.max(0, copiedDef.cost - 1);
          if (me.gold < discounted) {
            showToast(`NEED ${discounted} GOLD TO COPY ${copiedDef.name} WITH WIZARD`);
            return;
          }
          me.hand[handIndex] = copiedDef.id;
          me.gold += (copiedDef.cost - discounted); // refund difference before normal flow
          if (copiedDef.id === 'goldchest' || copiedDef.id === 'goldcoins') {
            state.room.commonwealth += 1; // Wizard bonus +1 gold to Commonwealth
          }
          state.pendingCardPlay = null;
          state.activeModal = null;
          handleCardClickInHand(handIndex);
          return;
        }
      }

      const targetLabel = targetId === 'DRAGON' ? 'THE DRAGON' : (target ? target.name : '');
      state.pendingCardPlay = null;
      state.activeModal = null;
      checkWinConditions();
      broadcastRoomState();
      renderApp();
      triggerCardCutscene(me.name, cardId, targetLabel);
    }

                ›

    function renderRoleRevealScreen() {
      const me = getMyPlayer();
      const count = state.room.players.length;
      const dist = ROLE_DISTRIBUTION[Math.min(16, Math.max(5, count))] || { heroes: 3, goblins: 2 };
      const isGoblin = me?.role === 'GOBLIN';

      return `
        <div class="flex-1 flex flex-col items-center justify-center px-4 py-10 text-center">

              <div class="w-[220px] h-[300px] rounded-xl bg-[#ebe3ce] p-3 shadow-xl border-2 border-[#cbbd9d] flex items-center justify-center">

                    <div class="text-3xl -mt-2 rotate-180">👺</div>

                  <div class="px-4 py-0.5 bg-[#cbbd9d] border border-[#1b312e] rounded text-[11px] font-heading font-bold text-[#1b312e]">

              <div class="w-[220px] h-[300px] rounded-xl bg-[#ebe3ce] p-4 shadow-xl border-2 border-[#1b312e] flex flex-col items-center justify-between">
                <div class="font-heading text-xs text-[#534b3b]">SECRET ROLE</div>
                <div class="font-heading text-3xl font-extrabold ${isGoblin ? 'text-red-800' : 'text-[#16423c]'}">
                  ${me?.role || 'HERO'}
                </div>
                <div class="text-6xl my-2">${isGoblin ? '👺' : '⚔️'}</div>
                <p class="font-heading text-[10px] leading-relaxed text-[#1b312e]">
                  ${isGoblin
                    ? `ELIMINATE ALL HEROES OR COLLECTIVELY HOLD ${state.room.goblinGoldGoal} CANDY/GOLD PER SURVIVING GOBLIN!`

            `}

          <div class="font-heading text-xs font-bold tracking-widest text-[#4f4738] mb-3">

          </div>

          <p class="font-heading text-sm max-w-md text-[#4f4738] leading-relaxed mb-3">
            THIS IS YOUR ROLE. KEEP IT SECRET. YOU CANNOT TELL OTHER PLAYERS WHAT YOU ARE.
          </p>

          <p class="font-heading text-sm font-bold text-[#16423c] mb-6">
            THIS GAME HAS ${dist.goblins} GOBLINS AND ${dist.heroes} HEROES.
          </p>

          </button>
        </div>
      `;

    // SCREEN 8, 9 & 10: ACTIVE GAMEPLAY WITH CIRCULAR VILLAGE TABLETOP SEATING (DAY & NIGHT)
    function renderGameScreen() {
      if (state.room.phase === 'night') {
        document.body.classList.add('night-mode');
        return renderNightPhaseScreen();
      }
      document.body.classList.remove('night-mode');

      const me = getMyPlayer();
      const active = getActiveTurnPlayer();
      const isMyTurn = me && active && me.id === active.id && state.room.phase === 'day';
      const step = state.room.turnStep;

      const maxContribute = me ? Math.min(2, me.gold) : 2;
      const maxTake = Math.min(4, state.room.commonwealth);
      const sliderVal = Math.max(-maxContribute, Math.min(maxTake, state.step1Amount));

      let sliderLabel = `TAKE ${sliderVal}`;
      if (sliderVal < 0) sliderLabel = `CONTRIBUTE ${Math.abs(sliderVal)}`;
      else if (sliderVal === 0) sliderLabel = `TAKE 0`;

      const players = state.room.players;
      const total = players.length;

      return `
        <div class="flex-1 flex flex-col justify-between min-h-screen pb-44">
          <!-- Top Green Progress Bar -->
          <div class="w-full h-1.5 bg-[#2e8b2e]"></div>

          <!-- Top Bar: Turn Timer Pill, Last Action Log & Room Code -->
          <div class="px-4 pt-2.5 flex items-center justify-between gap-2 flex-wrap">
            <div class="inline-flex items-center gap-2">
              <div class="w-8 h-8 rounded-full bg-[#e6dcc5] border-2 border-[#1b312e] flex items-center justify-center font-heading text-xs font-bold text-[#1b312e]">
                ${state.timerPaused ? '⏸' : '29'}
              </div>
              <div class="px-3 py-1 rounded bg-[#e6dcc5] border border-[#cbbd9d] font-heading text-[10px] font-bold text-[#1b312e]">
                DAY ${state.room.dayNumber} · ${step === 1 ? 'STEP 1: COMMONWEALTH' : 'STEP 2: PLAY GAMBIT CARDS'}
              </div>
            </div>

            ${state.room.lastActionBanner ? `
              <div class="sketch-box px-3.5 py-1 bg-[#ebe3ce] flex items-center gap-2">
                <span class="font-heading text-[10px] font-bold text-[#1b312e]">📜 ${state.room.lastActionBanner}</span>
                <button data-action="open-history-modal" class="text-xs font-heading font-bold text-[#16423c] hover:underline">HISTORY ›</button>
              </div>
            ` : ''}

            <div class="font-heading text-xs font-bold text-[#16423c] sketch-box px-3 py-1">
              ROOM: ${state.room.code}
            </div>
          </div>

          <!-- MAIN CIRCULAR VILLAGE TABLETOP ARENA -->
          <div class="w-full max-w-[1120px] mx-auto px-3 my-2 flex-1 flex flex-col items-center justify-center">

            ${state.room.phase === 'gameover' && state.room.winner ? `
              <!-- VICTORY BANNER -->
              <div class="sketch-box p-5 text-center mb-4 bg-[#ebe3ce] max-w-md w-full z-30">
                <div class="text-4xl mb-1">${state.room.winner.team === 'GOBLINS' ? '🎃👺' : '⚔️🛡️'}</div>
                <h2 class="font-heading text-2xl font-bold text-[#16423c] mb-1">${state.room.winner.team} WIN!</h2>
                <p class="font-heading text-xs text-[#1b312e] mb-3">${state.room.winner.reason}</p>
                <div class="flex gap-2 justify-center">
                  <button data-action="play-again" class="sketch-btn btn-gold px-5 py-2 text-xs">PLAY AGAIN</button>
                  <button data-action="return-lobby" class="sketch-btn btn-cream px-5 py-2 text-xs">BACK TO LOBBY</button>
                </div>
              </div>
            ` : ''}

            <!-- CIRCULAR RING CONTAINER (Seats positioned around the oval table in clockwise turn order) -->
            <div class="relative w-full h-[540px] sm:h-[600px] flex items-center justify-center select-none">

              <!-- Decorative Outer Tabletop Ring -->
              <div class="absolute w-[84%] h-[80%] rounded-[50%] border-2 border-dashed border-[#8c7b5c]/60 bg-[#ebe3ce]/40 pointer-events-none"></div>

              <!-- CENTER OF THE CIRCLE: COMMONWEALTH CAULDRON & STEP 1 / STEP 2 CONTROLS -->
              <div class="relative z-20 w-[290px] sm:w-[360px] sketch-box p-3.5 sm:p-4 bg-[#e5dcc4]/95 shadow-xl text-center">
                <!-- Step 1 & Step 2 Indicator Tabs -->
                <div class="grid grid-cols-2 gap-1.5 mb-2.5">
                  <div class="py-1 px-2 rounded border border-[#1b312e] text-center ${step === 1 ? 'bg-[#1f7a1f] text-white' : 'bg-[#dfd5bc] text-[#4f4738]'}">
                    <div class="font-heading text-[8px] font-bold">STEP 1: COMMONWEALTH</div>
                  </div>
                  <div class="py-1 px-2 rounded border border-[#1b312e] text-center ${step === 2 ? 'bg-[#1f7a1f] text-white' : 'bg-[#dfd5bc] text-[#4f4738]'}">
                    <div class="font-heading text-[8px] font-bold">STEP 2: GAMBIT CARDS</div>
                  </div>
                </div>

                <!-- Commonwealth Candy Pile Badge -->
                <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#ebe3ce] border border-[#1b312e] font-heading text-[10px] font-bold text-[#16423c] mb-2">
                  <span>🍯 COMMONWEALTH PILE: ${state.room.commonwealth}</span>
                  ${renderCandySVG(18)}
                  <span>· ${state.room.turnsLeftInRound} TURNS LEFT</span>
                </div>

                <!-- Active Dragon Boss in Center of Table (if in play) -->
                ${state.room.dragon ? `
                  <div class="mb-2 p-1.5 rounded bg-red-900/15 border border-red-900/40 flex items-center justify-center gap-2">
                    <span class="text-lg">🐉</span>
                    <span class="font-heading text-[10px] font-bold text-red-950">
                      DRAGON HOARD: ${state.room.dragon.gold} CANDY (${state.room.dragon.accusations}/3🎃 TO SLAY)
                    </span>
                  </div>
                ` : ''}

                ${step === 1 ? `
                  <div class="font-heading text-lg font-extrabold text-[#16423c] my-1 flex items-center justify-center gap-1.5">
                    <span>${sliderLabel}</span>
                    ${renderCandySVG(20)}
                  </div>
                  <div class="px-2 my-2">
                    <input id="commonwealthSlider" type="range" min="${-maxContribute}" max="${maxTake}" step="1" value="${sliderVal}"
                           class="commonwealth-slider" ${!isMyTurn ? 'disabled' : ''} />
                    <div class="flex justify-between font-heading text-[8px] text-[#534b3b] mt-1">
                      <span>CONTRIBUTE ${maxContribute}</span>
                      <span>0</span>
                      <span>TAKE ${maxTake}</span>
                    </div>
                  </div>
                  <button data-action="confirm-step1" ${!isMyTurn ? 'disabled' : ''} class="sketch-btn btn-gold w-full py-2 text-xs mt-1">
                    ${isMyTurn ? 'CONFIRM AMOUNT' : `⏳ ${active?.name || 'PLAYER'}'S TURN...`}
                  </button>
                ` : `
                  <div class="font-heading text-[10px] text-[#1b312e] my-2">
                    PLAY ANY GAMBIT CARDS FROM YOUR HAND BELOW OR CLICK <strong>CYCLE (1G)</strong>. END TURN WITH ≤3 CARDS.
                  </div>
                  <button data-action="end-turn" ${!isMyTurn ? 'disabled' : ''} class="sketch-btn btn-gold w-full py-2.5 text-xs">
                    ${isMyTurn ? 'END TURN →' : `⏳ ${active?.name || 'PLAYER'}'S TURN...`}
                  </button>
                `}
              </div>

              <!-- CIRCULAR SEATS AROUND THE VILLAGE RING -->
              ${players.map((p, idx) => {
                // Place seat #1 at top (-90 deg) and proceed clockwise around the oval
                const angleRad = ((idx / total) * 2 * Math.PI) - (Math.PI / 2);
                const xPct = 50 + 42 * Math.cos(angleRad);
                const yPct = 50 + 41 * Math.sin(angleRad);

                const isTurn = idx === state.room.turnIndex && state.room.phase === 'day';
                const showRoleBadge = (p.id === myClientId) || p.roleRevealedToPublic || (me?.role === 'GOBLIN' && p.role === 'GOBLIN');
                const isLinked = state.room.linkedPair.includes(p.id);

                return `
                  <div style="left:${xPct}%; top:${yPct}%;"
                       class="absolute -translate-x-1/2 -translate-y-1/2 z-10 w-[132px] sm:w-[148px] sketch-box p-2 transition-all duration-300 ${isTurn ? 'bg-[#e8dec5] active-seat-glow scale-105 z-20' : 'bg-[#f3eee1]/95'} ${!p.alive ? 'opacity-45 grayscale' : ''}">
                    
                    <!-- Top Designation Header: Seat # + Active/Host/Role -->
                    <div class="flex items-center justify-between gap-1 mb-1">
                      <span class="px-1.5 py-0.2 rounded bg-[#16423c] text-[#f3eee1] font-heading text-[8px] font-bold">
                        SEAT #${idx + 1}
                      </span>
                      <div class="flex items-center gap-1">
                        ${isTurn ? `<span class="text-xs" title="Active Turn">⏳</span>` : ''}
                        ${showRoleBadge ? `
                          <span class="px-1 py-0.2 rounded font-heading text-[8px] font-bold ${p.role === 'GOBLIN' ? 'bg-red-800 text-white' : 'bg-emerald-800 text-white'}">
                            ${p.role}
                          </span>
                        ` : ''}
                      </div>
                    </div>

                    <!-- Avatar + Player Name & Status Badges -->
                    <div class="flex items-center gap-2 mb-1">
                      ${renderAvatarSVG(p.avatarId, 36)}
                      <div class="min-w-0 flex-1">
                        <div class="font-heading text-[11px] font-bold text-[#1b312e] truncate">
                          ${p.name} ${p.id === myClientId ? '(YOU)' : ''}
                        </div>
                        <div class="flex items-center gap-1 flex-wrap mt-0.5">
                          ${!p.alive ? `<span class="px-1 rounded bg-stone-900 text-white font-heading text-[7px]">OUT</span>` : ''}
                          ${p.cloaked ? `<span class="px-1 rounded bg-teal-200 border border-stone-800 font-heading text-[7px] font-bold">🧥CLOAK</span>` : ''}
                          ${p.shields > 0 ? `<span class="px-1 rounded bg-amber-200 border border-stone-800 font-heading text-[7px] font-bold">🛡️${p.shields}</span>` : ''}
                          ${isLinked ? `<span class="px-1 rounded bg-purple-200 border border-purple-900 font-heading text-[7px] font-bold">⛓️LINK</span>` : ''}
                        </div>
                      </div>
                    </div>

                    <!-- Bottom Resource Strip: Candies + Cards + Pumpkin Accusations -->
                    <div class="pt-1 border-t border-[#cbbd9d] flex items-center justify-between text-[10px] font-heading font-bold">
                      <span class="inline-flex items-center gap-0.5" title="${p.gold} Candy/Gold">
                        ${renderCandySVG(16)} <span>×${p.gold}</span>
                      </span>
                      <span class="inline-flex items-center gap-0.5" title="${p.hand.length} Gambit Cards">
                        ${renderMiniCardSVG(15)} <span>×${p.hand.length}</span>
                      </span>
                      <span class="inline-flex items-center gap-0.5 ${p.accusations >= 2 ? 'text-red-700 animate-pulse' : ''}" title="${p.accusations}/${p.threshold} Pumpkin Accusations">
                        ${renderPumpkinSVG(16)} <span>${p.accusations}/${p.threshold}</span>
                      </span>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <!-- FIXED BOTTOM HAND TRAY & CYCLE BUTTON (Matches Pic 8 & Pic 9) -->
          <div class="fixed bottom-0 left-0 right-0 h-40 bg-[#ebe3ce]/95 border-t border-[#cbbd9d] z-30 flex items-end justify-center px-4 pb-2">
            <!-- Cycle (1G) Button on Top-Right of Bottom Bar -->
            ${step === 2 && isMyTurn ? `
              <button data-action="toggle-cycle-mode" 
                      class="sketch-btn ${state.cycleMode ? 'btn-gold' : 'btn-cream'} fixed bottom-28 right-5 px-3 py-1.5 text-[10px] z-40">
                ${state.cycleMode ? 'SELECT CARD TO CYCLE (CANCEL)' : 'CYCLE (1G)'}
              </button>
            ` : ''}

            <!-- Fanned Hand Cards -->
            <div class="flex items-end justify-center -space-x-3 sm:-space-x-2 pb-1">
              ${(me?.hand || []).map((cId, idx) => {
                const cDef = CARD_LIBRARY.find(c => c.id === cId) || CARD_LIBRARY[0];
                const totalCards = me.hand.length;
                const angle = (idx - (totalCards - 1) / 2) * 4;
                return `
                  <div data-action="play-hand-card" data-idx="${idx}"
                       style="transform: rotate(${angle}deg);"
                       class="hand-card cursor-pointer w-[118px] sm:w-[132px] h-[164px] bg-[#ebe3ce] rounded-lg border-2 ${state.cycleMode ? 'border-orange-600 ring-2 ring-orange-400' : 'border-[#cbbd9d]'} shadow-md p-2 flex flex-col justify-between text-center select-none">
                    <div class="font-heading text-xs font-bold text-[#163832] tracking-tight truncate">${cDef.name}</div>
                    <div class="my-0.5">
                      ${renderCardArtworkSVG(cDef.artType, 68)}
                    </div>
                    <div class="font-heading text-[7.5px] leading-tight text-[#1b312e] line-clamp-3">
                      COST: <span class="text-[#c78d20] font-bold">${cDef.costLabel}</span>. ${cDef.desc}
                    </div>
                  </div>
                `;
              }).join('')}
              ${(me?.hand || []).length === 0 ? `
                <div class="font-heading text-xs text-[#534b3b] pb-12">NO GAMBIT CARDS IN HAND</div>
              ` : ''}
            </div>
          </div>
        </div>
      `;
    }

    // SCREEN 10: NIGHT PHASE WITH CIRCULAR TABLETOP RING (Matches Pic 10 + Circular Layout)
    function renderNightPhaseScreen() {
      const me = getMyPlayer();
      const isGoblin = me && me.alive && me.role === 'GOBLIN';
      const quota = getNightAccusationQuota();
      const myVoteObj = (me && state.room.nightVotes[me.id]) || { allocations: {}, confirmed: false };
      const usedCount = Object.values(myVoteObj.allocations).reduce((a, b) => a + b, 0);

      const livingGoblins = state.room.players.filter(p => p.alive && p.role === 'GOBLIN');
      const players = state.room.players;
      const total = players.length;

      return `
        <div class="flex-1 flex flex-col items-center justify-between px-4 py-6 min-h-screen">
          <!-- Top Night Banner -->
          <div class="sketch-box w-full max-w-[500px] p-4 text-center z-20">
            <div class="flex items-center justify-center gap-2 mb-1">
              <h2 class="font-heading text-xl font-bold text-[#16423c]">NIGHT ${state.room.dayNumber}</h2>
              <span class="px-2.5 py-0.5 rounded-full bg-[#e2d8be] font-heading text-[10px] font-bold text-[#16423c]">
                ${me?.role || 'SPECTATOR'}
              </span>
            </div>
            <p class="font-heading text-[11px] text-[#4f4738]">
              DAY ${state.room.dayNumber} IS OVER. THE VILLAGE SLEEPS around THE CIRCLE...
            </p>
          </div>
